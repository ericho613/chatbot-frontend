<div class="chat-input-panel">
  <div class="chat-input-shell">
    <textarea
      #textarea
      id="chatMessage"
      class="form-control chat-textarea"
      rows="1"
      [(ngModel)]="text"
      (input)="onInput()"
      (keydown)="onKeydown($event)"
      [placeholder]="'chat.inputPlaceholder' | t"
      [attr.aria-label]="'chat.inputPlaceholder' | t"></textarea>

    <button
      type="button"
      class="send-icon-btn"
      (click)="submit()"
      [disabled]="!text.trim()"
      [attr.aria-label]="'chat.sendMessage' | t">
      <i class="fa-solid fa-paper-plane" aria-hidden="true"></i>
    </button>
  </div>
</div>
