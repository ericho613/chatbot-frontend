<aside
  class="sidebar"
  [class.collapsed]="!expanded && !mobileMode"
  [class.mobile-mode]="mobileMode"
  [attr.aria-label]="'sidebar.aria' | t">

  <div class="sidebar-header" *ngIf="!mobileMode">
    <button
      type="button"
      class="btn btn-link sidebar-toggle"
      [title]="expanded ? ('sidebar.hideTools' | t) : ('sidebar.showTools' | t)"
      (click)="toggleSidebar()"
      [attr.aria-expanded]="expanded"
      [attr.aria-label]="expanded ? ('sidebar.collapse' | t) : ('sidebar.expand' | t)">
      <i
        class="fa-solid"
        [class.fa-angles-right]="!expanded"
        [class.fa-angles-left]="expanded"
        aria-hidden="true"></i>
    </button>

    <span class="sidebar-title" *ngIf="expanded">{{ 'sidebar.title' | t }}</span>
  </div>

  <nav class="feature-nav" [attr.aria-label]="'sidebar.navAria' | t">
    <button *ngIf="showLabels" type="button" class="feature-item" (click)="openRag()" [attr.aria-label]="'sidebar.openRag' | t">
      <i class="fa-solid fa-database feature-item-icon" aria-hidden="true"></i>
      <span class="feature-label">{{ 'sidebar.rag' | t }}</span>
    </button>

    <button *ngIf="showLabels" type="button" class="feature-item" (click)="openSummary()" [attr.aria-label]="'sidebar.openSummary' | t">
      <i class="fa-solid fa-file-lines feature-item-icon" aria-hidden="true"></i>
      <span class="feature-label">{{ 'sidebar.summary' | t }}</span>
    </button>

    <button *ngIf="showLabels" type="button" class="feature-item" (click)="openCitation()" [attr.aria-label]="'sidebar.openCitation' | t">
      <i class="fa-solid fa-quote-left feature-item-icon" aria-hidden="true"></i>
      <span class="feature-label">{{ 'sidebar.citation' | t }}</span>
    </button>

    <button *ngIf="showLabels" type="button" class="feature-item" (click)="openUpload()" [attr.aria-label]="'sidebar.openUpload' | t">
      <i class="fa-solid fa-cloud-arrow-up feature-item-icon" aria-hidden="true"></i>
      <span class="feature-label">{{ 'sidebar.upload' | t }}</span>
    </button>

    <button *ngIf="showLabels" type="button" class="feature-item" (click)="openJwt()" [attr.aria-label]="'sidebar.openJwt' | t">
      <i class="fa-solid fa-key feature-item-icon" aria-hidden="true"></i>
      <span class="feature-label">{{ 'sidebar.jwt' | t }}</span>
    </button>

    <button *ngIf="showLabels" type="button" class="feature-item" (click)="openSettings()" [attr.aria-label]="'sidebar.openSettings' | t">
      <i class="fa-solid fa-gear feature-item-icon" aria-hidden="true"></i>
      <span class="feature-label">{{ 'sidebar.settings' | t }}</span>
    </button>
  </nav>
</aside>
