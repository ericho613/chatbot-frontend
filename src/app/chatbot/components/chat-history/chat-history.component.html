<section
  class="chat-panel"
  [attr.aria-label]="'chat.ariaHistory' | t"
  (mouseenter)="hovered = true"
  (mouseleave)="hovered = false">

  <div class="chat-panel-controls right-control" [class.visible]="hovered">
    <button
      type="button"
      class="btn btn-sm btn-light icon-btn"
      (click)="copyRequested()"
      [attr.aria-label]="'chat.copyHistory' | t"
      [title]="'chat.copyHistory' | t">
      <i class="fa-regular fa-copy" aria-hidden="true"></i>
    </button>

    <button
      type="button"
      class="btn btn-sm btn-light icon-btn"
      (click)="clearRequested()"
      [attr.aria-label]="'chat.clearHistory' | t"
      [title]="'chat.clearHistory' | t">
      <i class="fa-regular fa-trash-can" aria-hidden="true"></i>
    </button>
  </div>

  <div #scrollContainer class="chat-scroll" (scroll)="onScroll()">
    <div
      *ngFor="let message of messages; trackBy: trackById"
      class="message-row"
      [class.user]="message.role === 'user'"
      [class.assistant]="message.role === 'assistant'">

      <article
        class="message-bubble"
        [attr.aria-label]="message.role === 'user' ? ('chat.userMessage' | t) : ('chat.assistantMessage' | t)">
        <div class="message-header">
          <div class="message-role-wrap">
            <i
              class="message-avatar fa-solid"
              [class.fa-user]="message.role === 'user'"
              [class.fa-robot]="message.role === 'assistant'"
              aria-hidden="true"></i>
            <div class="message-role">
              {{ message.role === 'user' ? ('chat.user' | t) : ('chat.assistant' | t) }}
            </div>
          </div>
        </div>

        <div
          class="message-content markdown-content"
          [innerHTML]="renderMarkdown(message.content)">
        </div>

        <div
          *ngIf="message.role === 'assistant' && message.pending"
          class="typing-indicator"
          [attr.aria-label]="'chat.typing' | t"
          role="status">
          <span></span><span></span><span></span>
        </div>
      </article>
    </div>
  </div>
</section>
