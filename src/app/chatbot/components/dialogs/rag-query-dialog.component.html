<div class="modal-header app-modal-header">
  <h2 class="modal-title h5" id="ragDialogTitle">RAG Query</h2>
  <button
    type="button"
    class="dialog-close-btn"
    aria-label="Close RAG Query dialog"
    (click)="activeModal.dismiss()">
    <i class="fa-solid fa-xmark" aria-hidden="true"></i>
  </button>
</div>

<div class="modal-body app-modal-body" aria-labelledby="ragDialogTitle">
  <p class="text-muted mb-4">
    Enter a question to query the vector database and generate an AI response based on retrieved document context.
  </p>

  <div class="dialog-field">
    <label for="ragQueryInput" class="mb-2">Query</label>
    <textarea
      id="ragQueryInput"
      class="form-control"
      rows="5"
      [(ngModel)]="query"
      aria-describedby="ragHelp"></textarea>

    <small id="ragHelp" class="form-text text-muted mt-2">
      The response will be added to the chat history as an assistant message.
    </small>
  </div>

  <div *ngIf="loading" class="text-center mt-4" role="status" aria-live="polite">
    <div class="spinner-border text-primary" aria-hidden="true"></div>
    <div class="mt-2">Processing request...</div>
  </div>
</div>

<div class="modal-footer app-modal-footer">
  <button type="button" class="btn btn-outline-secondary" (click)="activeModal.dismiss()">Cancel</button>
  <button type="button" class="btn btn-primary" (click)="submit()" [disabled]="!query.trim() || loading">Submit</button>
</div>
