<div class="modal-header app-modal-header">
  <h2 class="modal-title h5" id="ragDialogTitle">{{ 'rag.title' | t }}</h2>
  <button
    type="button"
    class="dialog-close-btn"
    [attr.aria-label]="'rag.close' | t"
    (click)="activeModal.dismiss()">
    <i class="fa-solid fa-xmark" aria-hidden="true"></i>
  </button>
</div>

<div class="modal-body app-modal-body" aria-labelledby="ragDialogTitle">
  <p class="text-muted mb-4">
    {{ 'rag.description' | t }}
  </p>

  <div class="dialog-field">
    <label for="ragQueryInput" class="mb-2">{{ 'rag.query' | t }}</label>
    <textarea
      id="ragQueryInput"
      class="form-control"
      rows="5"
      [(ngModel)]="query"
      aria-describedby="ragHelp"></textarea>

    <small id="ragHelp" class="form-text text-muted mt-2">
      {{ 'rag.help' | t }}
    </small>
  </div>

  <div *ngIf="loading" class="text-center mt-4" role="status" aria-live="polite">
    <div class="spinner-border text-primary" aria-hidden="true"></div>
    <div class="mt-2">{{ 'dialog.processing' | t }}</div>
  </div>
</div>

<div class="modal-footer app-modal-footer">
  <button type="button" class="btn btn-outline-secondary" (click)="activeModal.dismiss()">{{ 'dialog.cancel' | t }}</button>
  <button type="button" class="btn btn-primary" (click)="submit()" [disabled]="!query.trim() || loading">{{ 'dialog.submit' | t }}</button>
</div>
