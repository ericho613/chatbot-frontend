<div class="modal-header app-modal-header">
  <h2 class="modal-title h5" id="settingsDialogTitle">{{ 'settings.title' | t }}</h2>
  <button
    type="button"
    class="dialog-close-btn"
    [attr.aria-label]="'settings.close' | t"
    (click)="activeModal.dismiss()">
    <i class="fa-solid fa-xmark" aria-hidden="true"></i>
  </button>
</div>

<div class="modal-body app-modal-body" aria-labelledby="settingsDialogTitle">
  <div class="settings-section">
    <div class="setting-row">
      <div>
        <label class="setting-label" for="streamToggleDialog">{{ 'settings.streaming' | t }}</label>
        <div class="setting-help text-muted">
          {{ 'settings.streamingHelp' | t }}
        </div>
      </div>

      <label class="stream-toggle" for="streamToggleDialog">
        <input
          id="streamToggleDialog"
          type="checkbox"
          [checked]="chatState.streamingEnabled"
          (change)="setStreaming(($event.target).checked)"
          [attr.aria-label]="'settings.toggleStreaming' | t" />
        <span class="slider" aria-hidden="true"></span>
      </label>
    </div>
  </div>
</div>

<div class="modal-footer app-modal-footer">
  <button type="button" class="btn btn-outline-secondary" (click)="activeModal.close()">{{ 'dialog.done' | t }}</button>
</div>
