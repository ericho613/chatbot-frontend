<div class="modal-header app-modal-header">
  <h2 class="modal-title h5" id="settingsDialogTitle">Settings</h2>
  <button
    type="button"
    class="dialog-close-btn"
    aria-label="Close settings dialog"
    (click)="activeModal.dismiss()">
    <i class="fa-solid fa-xmark" aria-hidden="true"></i>
  </button>
</div>

<div class="modal-body app-modal-body" aria-labelledby="settingsDialogTitle">
  <div class="settings-section">
    <div class="setting-row">
      <div>
        <label class="setting-label" for="streamToggleDialog">Streaming responses</label>
        <div class="setting-help text-muted">
          Show assistant responses chunk by chunk as the server streams them.
        </div>
      </div>

      <label class="stream-toggle" for="streamToggleDialog">
        <input
          id="streamToggleDialog"
          type="checkbox"
          [checked]="chatState.streamingEnabled"
          (change)="setStreaming(($event.target).checked)"
          aria-label="Toggle streaming responses" />
        <span class="slider" aria-hidden="true"></span>
      </label>
    </div>
  </div>
</div>

<div class="modal-footer app-modal-footer">
  <button type="button" class="btn btn-outline-secondary" (click)="activeModal.close()">Done</button>
</div>
