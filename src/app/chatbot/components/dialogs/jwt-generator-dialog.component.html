<div class="modal-header app-modal-header">
  <h2 class="modal-title h5" id="jwtDialogTitle">{{ 'jwt.title' | t }}</h2>
  <button
    type="button"
    class="dialog-close-btn"
    [attr.aria-label]="'jwt.close' | t"
    (click)="activeModal.dismiss()">
    <i class="fa-solid fa-xmark" aria-hidden="true"></i>
  </button>
</div>

<div class="modal-body app-modal-body" aria-labelledby="jwtDialogTitle">
  <p class="text-muted mb-4">
    {{ 'jwt.description' | t }}
  </p>

  <div class="form-group dialog-field">
    <label for="jwtSecret" class="mb-2">{{ 'jwt.secret' | t }}</label>
    <textarea
      id="jwtSecret"
      class="form-control"
      rows="5"
      [(ngModel)]="secret"
      aria-describedby="jwtHelp"></textarea>
    <small id="jwtHelp" class="form-text text-muted mt-2">
      {{ 'jwt.help' | t }}
    </small>
  </div>
</div>

<div class="modal-footer app-modal-footer">
  <button type="button" class="btn btn-outline-secondary" (click)="activeModal.dismiss()">{{ 'dialog.cancel' | t }}</button>
  <button type="button" class="btn btn-primary" (click)="generate()" [disabled]="!secret.trim() || loading">
    {{ 'jwt.generate' | t }}
  </button>
</div>
