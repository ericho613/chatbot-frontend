# This nginx config does two things:

#     serves Angular SPA at /
#     proxies /api/ to backend container chatbot-backend:8000

# Because your backend routes are defined without /api prefix, nginx strips /api/ via proxy_pass .../.


server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 30M;

    # -----------------------------
    # FastAPI backend via same-origin /api
    # -----------------------------
    location /api/ {
        proxy_pass http://chatbot-backend:8000/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Good for streaming NDJSON responses
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        send_timeout 300s;
    }

    # -----------------------------
    # Angular SPA static files
    # -----------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml;
}